name: Deploy Vite site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  VITE_GA4_ID: ${{ vars.VITE_GA4_ID }}
  VITE_GSC_VERIFICATION: ${{ vars.VITE_GSC_VERIFICATION }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: Type check
        run: npm run typecheck
      - name: Configure Google integrations
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'index.html';
          let html = fs.readFileSync(path, 'utf8');
          html = html.replaceAll('__GA4_ID__', process.env.VITE_GA4_ID || '');
          html = html.replaceAll('__GSC_VERIFICATION__', process.env.VITE_GSC_VERIFICATION || '');
          fs.writeFileSync(path, html);
          NODE
      - name: Build
        run: npm run build
      - name: Prepare SPA fallback
        run: cp dist/index.html dist/404.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Core Web Vitals / Lighthouse audit
        continue-on-error: true
        run: |
          npx --yes lighthouse "${{ steps.deployment.outputs.page_url }}" \
            --quiet \
            --chrome-flags="--headless --no-sandbox" \
            --output=json \
            --output-path=./lighthouse-report.json
      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-core-web-vitals
          path: ./lighthouse-report.json
          if-no-files-found: warn
          retention-days: 14
